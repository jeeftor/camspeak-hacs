speak:
  name: Speak
  description: Send text-to-speech to a camera using camspeak's Kokoro engine
  target:
    entity:
      integration: camspeak
      domain: media_player
  fields:
    text:
      name: Text
      description: The text to speak
      required: true
      example: "Person detected at the door"
      selector:
        text:
          multiline: true
    voice:
      name: Voice
      description: TTS voice to use (leave empty for default; validated against server voice list at runtime)
      required: false
      example: af_sky
      selector:
        text:
    gain:
      name: Gain
      description: Volume gain (0-10, leave empty for camera default)
      required: false
      example: 3.0
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: slider
  response:
    optional:
      description: "Returns timing data: ttfs_ms, total_ms, timings"

play_preset:
  name: Play preset
  description: Play a saved audio preset on a camera
  target:
    entity:
      integration: camspeak
      domain: media_player
  fields:
    preset:
      name: Preset
      description: The preset name to play (from your camspeak library)
      required: true
      example: dog
      selector:
        text:
    category:
      name: Category
      description: Preset category (leave empty to search all categories)
      required: false
      example: alerts
      selector:
        text:
    gain:
      name: Gain
      description: Volume gain (0-10, leave empty for camera default)
      required: false
      example: 3.0
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: slider
    loop:
      name: Loop
      description: Loop the preset infinitely (pausable)
      required: false
      default: false
      selector:
        boolean:
  response:
    optional:
      description: "Returns timing data and playback status"

play_stream:
  name: Play stream
  description: Stream live audio from a URL to a camera (supports .pls/.m3u playlists)
  target:
    entity:
      integration: camspeak
      domain: media_player
  fields:
    url:
      name: URL
      description: Stream URL or playlist (.pls/.m3u)
      required: true
      example: "http://stream.example.com:8000/live"
      selector:
        text:
  response:
    optional:
      description: "Returns playback status"

play_url:
  name: Play URL
  description: Download audio from a URL, transcode, and play on camera
  target:
    entity:
      integration: camspeak
      domain: media_player
  fields:
    url:
      name: URL
      description: Audio file URL (mp3, wav, ogg, etc.)
      required: true
      example: "https://example.com/sound.mp3"
      selector:
        text:
  response:
    optional:
      description: "Returns timing data and playback status"

broadcast:
  name: Broadcast
  description: Send TTS or preset to all cameras simultaneously
  fields:
    text:
      name: Text
      description: Text to speak (alternative to preset)
      required: false
      example: "Attention all cameras"
      selector:
        text:
          multiline: true
    preset:
      name: Preset
      description: Preset name to play (alternative to text)
      required: false
      example: dog
      selector:
        text:
    category:
      name: Category
      description: Preset category (leave empty to search all categories)
      required: false
      example: uploads
      selector:
        text:
    voice:
      name: Voice
      description: TTS voice to use (leave empty for default; validated against server voice list at runtime)
      required: false
      example: af_sky
      selector:
        text:
    gain:
      name: Gain
      description: Volume gain (0-10, leave empty for camera default)
      required: false
      example: 3.0
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          mode: slider
  response:
    optional:
      description: "Returns list of cameras that succeeded"

beep:
  name: Beep
  description: Play an 800 Hz test beep on a camera
  target:
    entity:
      integration: camspeak
      domain: media_player

stop:
  name: Stop
  description: Stop audio playback on a camera (or all cameras if no target specified)
  target:
    entity:
      integration: camspeak
      domain: media_player
  response:
    optional:
      description: "Returns stop status per camera"

pause:
  name: Pause
  description: Pause a live stream or looped preset (resumable)
  target:
    entity:
      integration: camspeak
      domain: media_player
  response:
    optional:
      description: "Returns pause status per camera"

resume:
  name: Resume
  description: Resume a paused stream or looped preset
  target:
    entity:
      integration: camspeak
      domain: media_player
  response:
    optional:
      description: "Returns resume status per camera"
